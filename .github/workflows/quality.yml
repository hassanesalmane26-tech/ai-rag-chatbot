name: TRIDENT quality gate

on:
  pull_request:
  push:
    branches: [trident-ai]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trident
          POSTGRES_PASSWORD: trident-ci
          POSTGRES_DB: trident
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trident"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRIDENT_ENV: test
      TRIDENT_DATABASE_URL: postgresql://trident:trident-ci@127.0.0.1:5432/trident
      TRIDENT_SECURITY_MODE: disabled
      TRIDENT_DOCUMENTS_PATH: /tmp/trident-ci/documents
      TRIDENT_VECTOR_DB_PATH: /tmp/trident-ci/vector
      OPENAI_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci --prefix frontend
      - name: Prepare isolated runtime paths
        run: mkdir -p /tmp/trident-ci/documents /tmp/trident-ci/vector
      - name: Migrate PostgreSQL
        run: alembic upgrade head
      - name: Backend gate
        run: |
          python -m unittest discover -s tests -p 'test*.py'
          python -m compileall -q app tests alembic
          python -m pip check
      - name: Frontend gate
        run: |
          npm test --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Release preflight and manifest
        run: |
          python -m app.operations.preflight
          python -m app.operations.artifacts frontend/dist > frontend-dist.manifest.json
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: trident-ai-frontend-${{ github.sha }}
          path: |
            frontend/dist
            frontend-dist.manifest.json
          if-no-files-found: error
          retention-days: 14
