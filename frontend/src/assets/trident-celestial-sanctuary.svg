<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEFCFF" stop-opacity=".62"/>
      <stop offset=".18" stop-color="#67BDEA" stop-opacity=".46"/>
      <stop offset=".55" stop-color="#174D8A" stop-opacity=".72"/>
      <stop offset="1" stop-color="#031534" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#020E29" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#225994" stop-opacity=".5"/>
      <stop offset="1" stop-color="#061839" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C9F5FF" stop-opacity=".4"/>
      <stop offset=".08" stop-color="#429CD9" stop-opacity=".38"/>
      <stop offset="1" stop-color="#03132F" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="cloud">
      <stop stop-color="#ECFAFF" stop-opacity=".72"/>
      <stop offset=".38" stop-color="#80BDF0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4072CD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon">
      <stop stop-color="#EAFFFF" stop-opacity=".82"/>
      <stop offset=".18" stop-color="#70E8F4" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#4F8DF0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7247D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F1FFFF" stop-opacity="0"/>
      <stop offset=".3" stop-color="#C8FAFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#55D5F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8FBFF" stop-opacity=".3"/>
      <stop offset=".36" stop-color="#4AA4DC" stop-opacity=".22"/>
      <stop offset=".38" stop-color="#1A508B" stop-opacity=".48"/>
      <stop offset="1" stop-color="#071A3E" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="violetLight" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8BEFFF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#C3EFFF" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#B499FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8BEFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="windows" width="22" height="27" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.4" fill="#D7FBFF" fill-opacity=".8"/>
      <rect x="14" y="16" width="2" height="5" rx="1" fill="#75E6F5" fill-opacity=".55"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

